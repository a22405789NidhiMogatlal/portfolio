{% extends 'portfolio/base.html' %}

{% block content %}

<h2>Login com Link Mágico</h2>

<form method="POST">

    {% csrf_token %}

    <input type="email" name="email" placeholder="Email">

    <input type="submit" value="Enviar Link">

</form>

{% if mensagem %}
    <p>{{ mensagem }}</p>
{% endif %}

{% endblock %}
